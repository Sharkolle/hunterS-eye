name: pose_engine
description: >
  Open-source pose detection engine for Hunter's Eye — camera-based exercise
  rep counting, form-check state machines, and body-proportional calibration.
  This is the mobile counterpart of hunterS-eye's pose_detector.py.
version: 0.1.0
homepage: https://github.com/Sharkolle/hunters-eye-mobile-engine

environment:
  sdk: '>=3.4.0 <4.0.0'
  flutter: '>=3.24.0'

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.11.0+2
  google_mlkit_pose_detection: ^0.12.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
